<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WeWIN Lottery Random</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: 'Montserrat', Arial, sans-serif;
      color: #fff;
      background: linear-gradient(rgba(10, 43, 115, 0.3), rgba(4, 22, 56, 0.6)), url('anh1.jpg') center/cover no-repeat fixed;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        linear-gradient(120deg, rgba(255,255,255,0.08), transparent 35%),
        radial-gradient(circle at 75% 20%, rgba(255,215,106,0.18), transparent 30%);
      pointer-events: none;
    }

    .stage {
      width: min(1200px, 94vw);
      max-height: 94vh;
      min-height: 680px;
      border-radius: 40px;
      padding: 40px;
      background: rgba(0, 18, 60, 0.45);
      border: 1px solid rgba(255,255,255,0.25);
      border-top: 1px solid rgba(255,255,255,0.4);
      border-left: 1px solid rgba(255,255,255,0.4);
      box-shadow: 0 40px 100px rgba(0,0,0,0.7), inset 0 0 40px rgba(255,255,255,0.1);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      position: relative;
      overflow: auto;
    }

    .brand {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 20px;
    }

    .logoImage {
      max-width: clamp(200px, 30vw, 350px);
      height: auto;
      filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5)) drop-shadow(0 0 15px rgba(255,215,106,0.4));
      margin-bottom: 10px;
      transition: transform 0.3s ease;
    }
    
    .logoImage:hover {
      transform: scale(1.05) rotate(-2deg);
    }

    .sub {
      font-size: clamp(16px, 2.2vw, 24px);
      font-weight: 500;
      opacity: 0.95;
      margin-top: 10px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6);
      letter-spacing: 0.5px;
    }

    .mascot {
      width: clamp(150px, 25vw, 260px);
      height: auto;
      animation: float 4s infinite ease-in-out;
      flex: 0 0 auto;
      filter: drop-shadow(0 20px 30px rgba(0,0,0,0.5)) drop-shadow(0 0 30px rgba(255,215,106,0.4));
      object-fit: contain;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-12px) scale(1.02); }
    }

    .settings {
      display: grid;
      grid-template-columns: repeat(3, minmax(150px, 1fr));
      gap: 16px;
      padding: 20px;
      border-radius: 28px;
      background: linear-gradient(135deg, rgba(255,255,255,0.15), rgba(255,255,255,0.05));
      border: 1px solid rgba(255,255,255,0.3);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3), inset 0 0 20px rgba(255,255,255,0.05);
      margin: 12px 0 24px;
      backdrop-filter: blur(10px);
    }

    .field label {
      display: block;
      font-size: 15px;
      font-weight: 700;
      opacity: 0.95;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }

    .field input {
      width: 100%;
      border: 2px solid transparent;
      outline: none;
      border-radius: 18px;
      padding: 16px 20px;
      font-size: 24px;
      font-weight: 900;
      color: #041638;
      background: rgba(255,255,255,0.95);
      box-shadow: inset 0 4px 12px rgba(0,0,0,0.15), 0 4px 12px rgba(0,0,0,0.1);
      transition: all 0.3s ease;
      font-family: inherit;
    }

    .field input:focus {
      border-color: #ffd76a;
      box-shadow: inset 0 4px 12px rgba(0,0,0,0.1), 0 0 15px rgba(255,215,106,0.6);
      transform: translateY(-2px);
    }


    .controls {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin: 16px 0 24px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 20px;
      padding: 18px 40px;
      font-size: 24px;
      font-family: inherit;
      font-weight: 900;
      cursor: pointer;
      color: #073174;
      background: linear-gradient(135deg, #ffea9f, #ffc107, #f2a900);
      box-shadow: 0 15px 35px rgba(255,193,7,0.4), inset 0 0 10px rgba(255,255,255,0.5);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      user-select: none;
      position: relative;
      overflow: hidden;
    }

    button::after {
      content: '';
      position: absolute;
      top: 0; left: -100%; width: 50%; height: 100%;
      background: linear-gradient(to right, transparent, rgba(255,255,255,0.6), transparent);
      transform: skewX(-25deg);
      animation: buttonShine 3s infinite;
    }

    @keyframes buttonShine {
      0% { left: -100%; }
      20%, 100% { left: 200%; }
    }

    button:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 20px 40px rgba(255,193,7,0.5), inset 0 0 15px rgba(255,255,255,0.7); }
    button:active { transform: translateY(2px) scale(0.98); }
    button:disabled { opacity: .65; cursor: not-allowed; transform: none; box-shadow: none; }
    button:disabled::after { display: none; }

    .secondary {
      background: rgba(255,255,255,0.13);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.25);
      box-shadow: none;
    }

    .numbers {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 18px;
    }

    .ball {
      min-height: 100px;
      border-radius: 30px;
      display: grid;
      place-items: center;
      font-size: clamp(32px, 5vw, 48px);
      font-weight: 900;
      color: #fff;
      background: linear-gradient(135deg, rgba(255,255,255,0.3), rgba(255,255,255,0.05));
      border: 1px solid rgba(255,255,255,0.4);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      border-right: 1px solid rgba(255,255,255,0.1);
      box-shadow: inset 0 0 20px rgba(255,255,255,0.1), 0 15px 30px rgba(0,0,0,0.3);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      text-shadow: 0 0 15px rgba(255,255,255,0.6);
      position: relative;
      overflow: hidden;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .ball:hover {
      transform: translateY(-5px) scale(1.02);
    }

    .ball::after {
      content: "";
      position: absolute;
      width: 50%;
      height: 200%;
      background: rgba(255,255,255,0.18);
      transform: rotate(25deg) translateX(-160%);
      animation: shine 2.2s infinite;
    }

    @keyframes shine {
      0% { transform: rotate(25deg) translateX(-170%); }
      45%,100% { transform: rotate(25deg) translateX(260%); }
    }

    .rolling {
      animation: shake .08s infinite linear;
      color: #ffd76a;
      border-color: rgba(255,215,106,0.8);
      box-shadow: 0 0 26px rgba(255,215,106,0.35);
    }

    @keyframes shake {
      0% { transform: translateX(-2px) rotate(-1deg); }
      50% { transform: translateX(2px) rotate(1deg); }
      100% { transform: translateX(-2px) rotate(-1deg); }
    }

    .final {
      background: linear-gradient(135deg, #ffea9f, #f4b400);
      color: #073174;
      border: 2px solid #fff;
      box-shadow: 0 0 40px rgba(255, 215, 106, 0.6), inset 0 0 20px rgba(255, 255, 255, 0.8);
      animation: pop .5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      text-shadow: none;
    }

    @keyframes pop {
      0% { transform: scale(.6); opacity: .3; }
      70% { transform: scale(1.12); }
      100% { transform: scale(1); opacity: 1; }
    }

    .note {
      text-align: center;
      margin-top: 18px;
      opacity: .85;
      font-size: 15px;
      line-height: 1.45;
    }

    .error {
      color: #ffd76a;
      font-weight: 900;
    }

    @media (max-width: 760px) {
      body { overflow: auto; }
      .stage { padding: 20px; min-height: auto; max-height: none; }
      .brand { flex-direction: column; text-align: center; }
      .mascot { width: 180px; height: auto; margin-top: 15px; }
      .settings { grid-template-columns: 1fr; }
      .numbers { grid-template-columns: repeat(auto-fit, minmax(72px, 1fr)); gap: 12px; }
      .ball { min-height: 72px; border-radius: 20px; }
      button { font-size: 18px; padding: 14px 22px; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <section class="brand">
      <div>
        <img src="logo.png" alt="WEWIN Logo" class="logoImage" />
        <div class="sub" id="subtitle">🎲 Lottery Random 20 số từ 1 đến 500</div>
      </div>
      <img src="linhvat.png" alt="Linh vật" class="mascot" />
    </section>

    <section class="settings" aria-label="Cài đặt quay số">
      <div class="field">
        <label for="minNum">Từ số</label>
        <input id="minNum" type="number" min="1" step="1" value="1" />
      </div>
      <div class="field">
        <label for="maxNum">Đến số</label>
        <input id="maxNum" type="number" min="1" step="1" value="500" />
      </div>
      <div class="field">
        <label for="drawCount">Số lượng cần quay</label>
        <input id="drawCount" type="number" min="1" step="1" value="20" />
      </div>
    </section>


    <div class="controls">
      <button id="startBtn" onclick="startLottery()">🎡 QUAY SỐ</button>
      <button class="secondary" onclick="resetNumbers()">LÀM MỚI</button>
    </div>

    <section class="numbers" id="numbers"></section>
    <div class="note" id="note"></div>
  </main>

  <script>
    const numbersEl = document.getElementById('numbers');
    const startBtn = document.getElementById('startBtn');
    const subtitleEl = document.getElementById('subtitle');
    const noteEl = document.getElementById('note');
    const minInput = document.getElementById('minNum');
    const maxInput = document.getElementById('maxNum');
    const countInput = document.getElementById('drawCount');
    const allInputs = [minInput, maxInput, countInput];
    let audioCtx;

    function toInteger(value) {
      return Number.parseInt(value, 10);
    }

    function getSettings(showAlert = true) {
      const min = toInteger(minInput.value);
      const max = toInteger(maxInput.value);
      const count = toInteger(countInput.value);

      if (!Number.isInteger(min) || !Number.isInteger(max) || !Number.isInteger(count)) {
        if (showAlert) alert('Vui lòng nhập đầy đủ: từ số, đến số và số lượng cần quay.');
        return null;
      }

      if (min < 1 || max < 1 || count < 1) {
        if (showAlert) alert('Các giá trị phải lớn hơn hoặc bằng 1.');
        return null;
      }

      if (min > max) {
        if (showAlert) alert('“Từ số” không được lớn hơn “Đến số”.');
        return null;
      }

      const rangeSize = max - min + 1;
      if (count > rangeSize) {
        if (showAlert) alert(`Không thể quay ${count} số vì khoảng ${min} đến ${max} chỉ có ${rangeSize} số.`);
        return null;
      }

      return { min, max, count, rangeSize };
    }

    function updateText() {
      const min = toInteger(minInput.value) || 1;
      const max = toInteger(maxInput.value) || 500;
      const count = toInteger(countInput.value) || 20;
      subtitleEl.textContent = `🎲 Lottery Random ${count} số từ ${min} đến ${max}`;

      const rangeSize = max >= min ? max - min + 1 : 0;
      if (rangeSize > 0 && count > rangeSize) {
        noteEl.innerHTML = `<span class="error">Số lượng cần quay đang lớn hơn khoảng số hiện có.</span> Hãy giảm số lượng hoặc tăng khoảng số.`;
      } else {
        noteEl.textContent = ``;
      }
    }

    function initBoxes(count = null) {
      const settings = getSettings(false);
      const boxCount = count || (settings ? settings.count : 20);

      numbersEl.innerHTML = '';
      for (let i = 0; i < boxCount; i++) {
        const box = document.createElement('div');
        box.className = 'ball';
        box.textContent = '---';
        numbersEl.appendChild(box);
      }

      updateText();
    }

    function setControlsDisabled(disabled) {
      startBtn.disabled = disabled;
      document.querySelectorAll('button.secondary, input').forEach(el => {
        el.disabled = disabled;
      });
    }


    function beep(freq = 700, duration = 0.055, type = 'sine', volume = 0.07) {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.value = volume;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
      osc.stop(audioCtx.currentTime + duration);
    }

    function victorySound() {
      const notes = [523, 659, 784, 1046];
      notes.forEach((n, i) => setTimeout(() => beep(n, 0.11, 'triangle', 0.3), i * 120));
    }

    function uniqueRandomNumbers(count, min, max) {
      const pool = [];
      for (let n = min; n <= max; n++) pool.push(n);

      // Fisher-Yates shuffle một phần để chọn số nhanh và không bị trùng.
      for (let i = 0; i < count; i++) {
        const randomIndex = i + Math.floor(Math.random() * (pool.length - i));
        [pool[i], pool[randomIndex]] = [pool[randomIndex], pool[i]];
      }

      return pool.slice(0, count);
    }

    async function startLottery() {
      const settings = getSettings(true);
      if (!settings) return;

      const { min, max, count } = settings;
      initBoxes(count);
      setControlsDisabled(true);
      startBtn.textContent = 'ĐANG QUAY...';

      const boxes = [...document.querySelectorAll('.ball')];
      const finalNumbers = uniqueRandomNumbers(count, min, max);

      boxes.forEach(box => {
        box.className = 'ball rolling';
        box.textContent = '000';
      });

      const rolling = setInterval(() => {
        boxes.forEach(box => {
          box.textContent = Math.floor(Math.random() * (max - min + 1)) + min;
        });
        beep(520 + Math.random() * 250, 0.035, 'square', 0.15);
      }, 75);

      await new Promise(resolve => setTimeout(resolve, 2300));
      clearInterval(rolling);

      const revealDelay = Math.max(25, Math.min(115, Math.floor(1800 / boxes.length)));

      for (let i = 0; i < boxes.length; i++) {
        await new Promise(resolve => setTimeout(resolve, revealDelay));
        boxes[i].className = 'ball final';
        boxes[i].textContent = finalNumbers[i];

        if (boxes.length <= 80 || i % 5 === 0) {
          beep(850 + i * 18, 0.07, 'triangle', 0.25);
        }
      }

      setTimeout(victorySound, 250);
      setControlsDisabled(false);
      startBtn.textContent = '🎡 QUAY LẠI';
    }

    function resetNumbers() {
      const settings = getSettings(true);
      if (!settings) return;

      initBoxes(settings.count);
      startBtn.textContent = '🎡 QUAY SỐ';
      startBtn.disabled = false;
    }

    allInputs.forEach(input => {
      input.addEventListener('input', updateText);
      input.addEventListener('change', () => {
        const settings = getSettings(false);
        if (settings) initBoxes(settings.count);
      });
    });

    initBoxes();
  </script>
</body>
</html>
