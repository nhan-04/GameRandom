<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Random Number - Xổ Số Vui Nhộn</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800;900&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue: #2f7df6;
      --cyan: #42d9ff;
      --pink: #ff6bd6;
      --yellow: #ffe66d;
      --orange: #ff9f43;
      --green: #42e695;
      --purple: #9b5cff;
      --dark: #17306b;
      --white: #ffffff;
    }

    body {
      min-height: 100vh;
      font-family: 'Montserrat', Arial, sans-serif;
      color: var(--white);
      background:
        radial-gradient(circle at 10% 10%, rgba(255, 230, 109, .85), transparent 22%),
        radial-gradient(circle at 90% 15%, rgba(255, 107, 214, .75), transparent 24%),
        radial-gradient(circle at 20% 85%, rgba(66, 230, 149, .75), transparent 24%),
        radial-gradient(circle at 85% 85%, rgba(66, 217, 255, .8), transparent 24%),
        linear-gradient(135deg, #7cc7ff 0%, #8f80ff 42%, #ff87c8 100%);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    body::before {
      background-image:
        radial-gradient(circle, rgba(255,255,255,.65) 0 3px, transparent 4px),
        radial-gradient(circle, rgba(255,255,255,.35) 0 6px, transparent 7px);
      background-size: 72px 72px, 128px 128px;
      animation: floatDots 16s linear infinite;
      opacity: .55;
    }

    body::after {
      background:
        linear-gradient(120deg, rgba(255,255,255,.32), transparent 35%),
        radial-gradient(circle at 50% 2%, rgba(255,255,255,.35), transparent 28%);
      mix-blend-mode: soft-light;
    }

    @keyframes floatDots {
      from { background-position: 0 0, 0 0; }
      to { background-position: 72px 72px, -128px 128px; }
    }

    .stage {
      width: min(1260px, 96vw);
      max-height: 96vh;
      min-height: 690px;
      border-radius: 42px;
      padding: 34px;
      background: rgba(255, 255, 255, 0.26);
      border: 2px solid rgba(255,255,255,0.52);
      box-shadow:
        0 38px 100px rgba(31, 30, 80, 0.35),
        inset 0 0 38px rgba(255,255,255,0.18);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      position: relative;
      overflow: auto;
      z-index: 1;
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: 12px;
      border-radius: 34px;
      border: 2px dashed rgba(255,255,255,.35);
      pointer-events: none;
    }

    .brand {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 22px;
      margin-bottom: 18px;
      position: relative;
      z-index: 1;
    }

    .sub {
      font-size: clamp(28px, 4vw, 54px);
      font-weight: 900;
      line-height: 1.05;
      color: #fff;
      text-shadow:
        0 5px 0 rgba(23, 48, 107, .22),
        0 14px 28px rgba(23, 48, 107, .32);
      letter-spacing: .5px;
    }

    .headline-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
      padding: 10px 18px;
      border-radius: 999px;
      font-weight: 900;
      color: var(--dark);
      background: linear-gradient(135deg, #fff6a8, #fff, #baf7ff);
      box-shadow: 0 12px 24px rgba(23,48,107,.18);
    }

    .mascot {
      width: clamp(145px, 23vw, 250px);
      height: auto;
      animation: mascotFloat 4s infinite ease-in-out;
      flex: 0 0 auto;
      filter:
        drop-shadow(0 18px 24px rgba(31, 30, 80, 0.25))
        drop-shadow(0 0 24px rgba(255, 230, 109, 0.55));
      object-fit: contain;
    }

    @keyframes mascotFloat {
      0%, 100% { transform: translateY(0) rotate(-2deg) scale(1); }
      50% { transform: translateY(-13px) rotate(2deg) scale(1.03); }
    }

    .settings {
      display: grid;
      grid-template-columns: repeat(3, minmax(150px, 1fr));
      gap: 16px;
      padding: 18px;
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.56), rgba(255,255,255,0.22));
      border: 2px solid rgba(255,255,255,0.56);
      box-shadow: 0 16px 32px rgba(31,30,80,0.16);
      margin: 12px 0 20px;
      position: relative;
      z-index: 1;
    }

    .field label {
      display: block;
      font-size: 14px;
      font-weight: 900;
      color: #17306b;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .field input {
      width: 100%;
      border: 3px solid transparent;
      outline: none;
      border-radius: 20px;
      padding: 15px 18px;
      font-size: 24px;
      font-weight: 900;
      color: #17306b;
      background: rgba(255,255,255,0.94);
      box-shadow: inset 0 5px 12px rgba(31,30,80,0.12), 0 8px 16px rgba(31,30,80,0.10);
      transition: all 0.25s ease;
      font-family: inherit;
    }

    .field input:focus {
      border-color: var(--yellow);
      box-shadow:
        inset 0 4px 10px rgba(31,30,80,0.08),
        0 0 0 6px rgba(255, 230, 109, .34);
      transform: translateY(-2px);
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin: 14px 0 20px;
      flex-wrap: wrap;
      position: relative;
      z-index: 1;
    }

    button {
      border: 0;
      border-radius: 24px;
      padding: 17px 34px;
      font-size: 22px;
      font-family: inherit;
      font-weight: 900;
      cursor: pointer;
      color: #17306b;
      background: linear-gradient(135deg, #fff8a8, #ffe66d 34%, #ffb703 100%);
      box-shadow:
        0 15px 26px rgba(255, 183, 3, 0.34),
        inset 0 0 14px rgba(255,255,255,0.66);
      transition: all 0.25s cubic-bezier(.2,.9,.2,1.15);
      user-select: none;
      position: relative;
      overflow: hidden;
    }

    button::after {
      content: '';
      position: absolute;
      top: 0;
      left: -120%;
      width: 60%;
      height: 100%;
      background: linear-gradient(to right, transparent, rgba(255,255,255,0.75), transparent);
      transform: skewX(-25deg);
      animation: buttonShine 2.8s infinite;
    }

    @keyframes buttonShine {
      0% { left: -120%; }
      25%, 100% { left: 210%; }
    }

    button:hover {
      transform: translateY(-3px) scale(1.04);
      box-shadow:
        0 18px 30px rgba(255, 183, 3, 0.42),
        inset 0 0 18px rgba(255,255,255,0.82);
    }

    button:active { transform: translateY(2px) scale(0.98); }
    button:disabled { opacity: .65; cursor: not-allowed; transform: none; box-shadow: none; }
    button:disabled::after { display: none; }

    .secondary {
      background: linear-gradient(135deg, rgba(255,255,255,.65), rgba(255,255,255,.25));
      color: #17306b;
      border: 2px solid rgba(255,255,255,0.62);
      box-shadow: 0 12px 24px rgba(31,30,80,.14);
    }

    .music-btn {
      background: linear-gradient(135deg, #a7ffdc, #42e695);
      display: none;
    }

    .numbers {
      display: grid;
      grid-template-columns: repeat(5, minmax(110px, 1fr));
      gap: 16px;
      position: relative;
      z-index: 1;
    }

    .ball {
      min-height: 104px;
      border-radius: 30px;
      display: grid;
      place-items: center;
      font-size: clamp(30px, 4.4vw, 48px);
      font-weight: 900;
      color: #17306b;
      background:
        linear-gradient(135deg, rgba(255,255,255,.92), rgba(255,255,255,.58)),
        radial-gradient(circle at 20% 15%, rgba(255,255,255,.9), transparent 28%);
      border: 3px solid rgba(255,255,255,0.72);
      box-shadow:
        inset 0 0 20px rgba(255,255,255,0.35),
        0 14px 24px rgba(31,30,80,0.18);
      text-shadow: 0 2px 0 rgba(255,255,255,.7);
      position: relative;
      overflow: hidden;
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
      isolation: isolate;
    }

    .ball:nth-child(5n+1) { background-color: rgba(255, 107, 214, .24); }
    .ball:nth-child(5n+2) { background-color: rgba(66, 217, 255, .24); }
    .ball:nth-child(5n+3) { background-color: rgba(255, 230, 109, .30); }
    .ball:nth-child(5n+4) { background-color: rgba(66, 230, 149, .24); }
    .ball:nth-child(5n+5) { background-color: rgba(155, 92, 255, .22); }

    .ball::before {
      content: "";
      position: absolute;
      inset: -40%;
      background: conic-gradient(from 0deg, transparent, rgba(255,255,255,.7), transparent 24%);
      opacity: 0;
      animation: spinGlow 1.8s linear infinite;
      z-index: -1;
    }

    .ball:hover {
      transform: translateY(-4px) scale(1.02);
    }

    .reelViewport {
      width: 100%;
      height: 100%;
      min-height: 104px;
      display: flex;
      align-items: center;
      overflow: hidden;
      border-radius: 26px;
    }

    .reelTrack {
      width: 100%;
      height: 100%;
      min-height: 104px;
      display: flex;
      align-items: center;
      will-change: transform;
      transform: translateX(0);
    }

    .reelTrack span {
      flex: 0 0 100%;
      display: grid;
      place-items: center;
      padding: 12px;
      line-height: 1;
    }

    .idle {
      color: rgba(23,48,107,.55);
    }

    .spinning {
      color: #fff;
      border-color: rgba(255,255,255,.9);
      background:
        linear-gradient(135deg, #ff6bd6, #9b5cff 42%, #42d9ff 100%);
      box-shadow:
        0 0 0 8px rgba(255,255,255,.18),
        0 0 34px rgba(255,255,255,.55),
        0 18px 34px rgba(31,30,80,.24);
      animation: suspenseShake .13s infinite linear;
      text-shadow: 0 4px 14px rgba(23,48,107,.48);
    }

    .spinning::before {
      opacity: .9;
    }

    .spinning .reelTrack {
      filter: blur(.7px);
    }

    @keyframes suspenseShake {
      0% { transform: translateX(-1px) rotate(-.5deg); }
      50% { transform: translateX(1px) rotate(.5deg); }
      100% { transform: translateX(-1px) rotate(-.5deg); }
    }

    @keyframes spinGlow {
      to { transform: rotate(360deg); }
    }

    .final {
      color: #17306b;
      border-color: #fff;
      background:
        radial-gradient(circle at 25% 18%, rgba(255,255,255,1), transparent 28%),
        linear-gradient(135deg, #fff8a8, #ffe66d 42%, #ffb703);
      box-shadow:
        0 0 0 8px rgba(255,255,255,.26),
        0 0 42px rgba(255, 230, 109, 0.78),
        inset 0 0 18px rgba(255,255,255,0.74);
      animation: finalPop .55s cubic-bezier(.18,.9,.2,1.35);
      text-shadow: 0 2px 0 rgba(255,255,255,.85);
    }

    .final .reelTrack {
      filter: none;
    }

    @keyframes finalPop {
      0% { transform: scale(.68); opacity: .45; }
      58% { transform: scale(1.14); }
      100% { transform: scale(1); opacity: 1; }
    }

    .progress {
      margin: 0 auto 16px;
      max-width: 720px;
      height: 18px;
      border-radius: 999px;
      overflow: hidden;
      border: 2px solid rgba(255,255,255,.62);
      background: rgba(255,255,255,.35);
      box-shadow: inset 0 4px 8px rgba(31,30,80,.12);
      position: relative;
      z-index: 1;
    }

    .progressBar {
      width: 0%;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #42e695, #42d9ff, #ffe66d, #ff6bd6);
      transition: width .4s ease;
    }

    .note {
      text-align: center;
      margin: 16px 0 14px;
      color: #17306b;
      font-size: 16px;
      font-weight: 800;
      line-height: 1.45;
      position: relative;
      z-index: 1;
      text-shadow: 0 1px 0 rgba(255,255,255,.48);
    }

    .error {
      color: #d60045;
      font-weight: 900;
    }

    .confetti {
      position: fixed;
      width: 10px;
      height: 16px;
      top: -20px;
      left: 50%;
      border-radius: 4px;
      pointer-events: none;
      animation: confettiFall 1.2s ease-out forwards;
      z-index: 20;
    }

    @keyframes confettiFall {
      0% { transform: translate3d(0,0,0) rotate(0deg); opacity: 1; }
      100% { transform: translate3d(var(--x), 115vh, 0) rotate(720deg); opacity: 0; }
    }

    @media (max-width: 880px) {
      body { overflow: auto; }
      .stage { padding: 22px; min-height: auto; max-height: none; }
      .brand { flex-direction: column; text-align: center; }
      .mascot { width: 170px; }
      .settings { grid-template-columns: 1fr; }
      .numbers { grid-template-columns: repeat(2, minmax(110px, 1fr)); gap: 12px; }
      .ball, .reelViewport, .reelTrack { min-height: 86px; }
      button { font-size: 18px; padding: 14px 22px; }
    }

    @media (min-width: 881px) and (max-width: 1080px) {
      .numbers { grid-template-columns: repeat(4, minmax(110px, 1fr)); }
    }
  </style>
</head>

<body>
  <audio id="bgMusic" src="nhacxoso.mp3" preload="auto" autoplay loop></audio>

  <main class="stage">
    <section class="brand">
      <div>
        <div class="sub" id="subtitle">🎲 Xổ Số Vui Nhộn</div>
        <div class="headline-pill" id="statusPill">Mỗi 5 giây mở 5 số 🎉</div>
      </div>

      <img
        src="https://i.ibb.co/gZZVKky0/linhvat.png"
        alt="Linh vật"
        class="mascot"
        onerror="this.style.display='none'"
      />
    </section>

    <section class="settings" aria-label="Cài đặt quay số">
      <div class="field">
        <label for="minNum">Từ số</label>
        <input id="minNum" type="number" min="1" step="1" value="1" />
      </div>

      <div class="field">
        <label for="maxNum">Đến số</label>
        <input id="maxNum" type="number" min="1" step="1" value="500" />
      </div>

      <div class="field">
        <label for="drawCount">Số lượng cần quay</label>
        <input id="drawCount" type="number" min="1" step="1" value="20" />
      </div>
    </section>

    <div class="controls">
      <button id="startBtn" onclick="startLottery()">🎡 QUAY SỐ</button>
      <button class="secondary" onclick="resetNumbers()">LÀM MỚI</button>
      <button class="music-btn" id="musicBtn" onclick="startBackgroundMusic()">🔊 BẬT NHẠC</button>
    </div>

    <div class="progress" aria-hidden="true">
      <div class="progressBar" id="progressBar"></div>
    </div>

    <div class="note" id="note"></div>
    <section class="numbers" id="numbers"></section>
  </main>

  <script>
    const BATCH_SIZE = 5;
    const SPIN_DURATION = 5000;

    const numbersEl = document.getElementById('numbers');
    const startBtn = document.getElementById('startBtn');
    const musicBtn = document.getElementById('musicBtn');
    const subtitleEl = document.getElementById('subtitle');
    const statusPill = document.getElementById('statusPill');
    const noteEl = document.getElementById('note');
    const progressBar = document.getElementById('progressBar');
    const minInput = document.getElementById('minNum');
    const maxInput = document.getElementById('maxNum');
    const countInput = document.getElementById('drawCount');
    const bgMusic = document.getElementById('bgMusic');
    const allInputs = [minInput, maxInput, countInput];

    let audioCtx;
    let isRunning = false;

    bgMusic.volume = 0.62;
    bgMusic.loop = true;

    function toInteger(value) {
      return Number.parseInt(value, 10);
    }

    function wait(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function randomBetween(min, max) {
      return min + Math.floor(Math.random() * (max - min + 1));
    }

    async function startBackgroundMusic() {
      try {
        bgMusic.loop = true;
        await bgMusic.play();
        musicBtn.style.display = 'none';
      } catch (error) {
        musicBtn.style.display = 'inline-block';
      }
    }

    document.addEventListener('DOMContentLoaded', startBackgroundMusic);
    document.addEventListener('pointerdown', startBackgroundMusic, { once: true });
    document.addEventListener('keydown', startBackgroundMusic, { once: true });

    function getSettings(showAlert = true) {
      const min = toInteger(minInput.value);
      const max = toInteger(maxInput.value);
      const count = toInteger(countInput.value);

      if (!Number.isInteger(min) || !Number.isInteger(max) || !Number.isInteger(count)) {
        if (showAlert) alert('Vui lòng nhập đầy đủ: từ số, đến số và số lượng cần quay.');
        return null;
      }

      if (min < 1 || max < 1 || count < 1) {
        if (showAlert) alert('Các giá trị phải lớn hơn hoặc bằng 1.');
        return null;
      }

      if (min > max) {
        if (showAlert) alert('“Từ số” không được lớn hơn “Đến số”.');
        return null;
      }

      const rangeSize = max - min + 1;

      if (count > rangeSize) {
        if (showAlert) alert(`Không thể quay ${count} số vì khoảng ${min} đến ${max} chỉ có ${rangeSize} số.`);
        return null;
      }

      return { min, max, count, rangeSize };
    }

    function updateText() {
      subtitleEl.textContent = '🎲 Xổ Số Vui Nhộn';

      const min = toInteger(minInput.value) || 1;
      const max = toInteger(maxInput.value) || 500;
      const count = toInteger(countInput.value) || 20;
      const rangeSize = max >= min ? max - min + 1 : 0;

      statusPill.textContent = `Mỗi ${SPIN_DURATION / 1000} giây mở ${BATCH_SIZE} số 🎉`;

      if (rangeSize > 0 && count > rangeSize) {
        noteEl.innerHTML = `<span class="error">Số lượng cần quay đang lớn hơn khoảng số hiện có.</span> Hãy giảm số lượng hoặc tăng khoảng số.`;
      } else {
        noteEl.textContent = `Sẵn sàng quay ${count} số không trùng trong khoảng ${min} đến ${max}.`;
      }
    }

    function createTrack(items) {
      const viewport = document.createElement('div');
      viewport.className = 'reelViewport';

      const track = document.createElement('div');
      track.className = 'reelTrack';

      items.forEach(item => {
        const span = document.createElement('span');
        span.textContent = item;
        track.appendChild(span);
      });

      viewport.appendChild(track);
      return { viewport, track };
    }

    function initBoxes(count = null) {
      const settings = getSettings(false);
      const boxCount = count || (settings ? settings.count : 20);

      numbersEl.innerHTML = '';

      for (let i = 0; i < boxCount; i++) {
        const box = document.createElement('div');
        box.className = 'ball idle';
        box.dataset.index = i;

        const { viewport } = createTrack(['---']);
        box.appendChild(viewport);
        numbersEl.appendChild(box);
      }

      progressBar.style.width = '0%';
      updateText();
    }

    function setControlsDisabled(disabled) {
      startBtn.disabled = disabled;

      document.querySelectorAll('button.secondary, input').forEach(el => {
        el.disabled = disabled;
      });
    }

    function beep(freq = 700, duration = 0.055, type = 'sine', volume = 0.07) {
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();

        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.value = volume;

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.stop(audioCtx.currentTime + duration);
      } catch (error) {
        // Nếu trình duyệt không hỗ trợ AudioContext thì bỏ qua hiệu ứng beep.
      }
    }

    function groupRevealSound() {
      const notes = [880, 988, 1175, 1319, 1568];

      notes.forEach((note, index) => {
        setTimeout(() => beep(note, 0.08, 'triangle', 0.18), index * 55);
      });
    }

    function victorySound() {
      const notes = [523, 659, 784, 1046, 1319];

      notes.forEach((note, index) => {
        setTimeout(() => beep(note, 0.12, 'triangle', 0.26), index * 115);
      });
    }

    function uniqueRandomNumbers(count, min, max) {
      const pool = [];

      for (let number = min; number <= max; number++) {
        pool.push(number);
      }

      // Fisher-Yates shuffle một phần để chọn số nhanh và không bị trùng.
      for (let i = 0; i < count; i++) {
        const randomIndex = i + Math.floor(Math.random() * (pool.length - i));
        [pool[i], pool[randomIndex]] = [pool[randomIndex], pool[i]];
      }

      return pool.slice(0, count);
    }

    function startHorizontalReel(box, finalNumber, min, max, duration, offset = 0) {
      const totalItems = 55 + offset * 4;
      const items = [];

      for (let i = 0; i < totalItems - 1; i++) {
        items.push(randomBetween(min, max));
      }

      items.push(finalNumber);

      box.className = 'ball spinning';
      box.innerHTML = '';

      const { viewport, track } = createTrack(items);
      box.appendChild(viewport);

      track.style.transition = 'none';
      track.style.transform = 'translateX(0)';

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          track.style.transition = `transform ${duration}ms cubic-bezier(.07,.78,.08,1)`;
          track.style.transform = `translateX(-${(items.length - 1) * 100}%)`;
        });
      });
    }

    function finalizeBox(box, finalNumber) {
      box.className = 'ball final';
      box.innerHTML = '';

      const { viewport } = createTrack([finalNumber]);
      box.appendChild(viewport);
    }

    function fireConfetti(amount = 60) {
      const colors = ['#ffe66d', '#ff6bd6', '#42d9ff', '#42e695', '#ff9f43', '#9b5cff'];

      for (let i = 0; i < amount; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti';
        piece.style.left = `${Math.random() * 100}vw`;
        piece.style.background = colors[Math.floor(Math.random() * colors.length)];
        piece.style.setProperty('--x', `${(Math.random() - 0.5) * 260}px`);
        piece.style.animationDelay = `${Math.random() * 0.25}s`;
        document.body.appendChild(piece);

        setTimeout(() => piece.remove(), 1600);
      }
    }

    async function startLottery() {
      if (isRunning) return;

      const settings = getSettings(true);
      if (!settings) return;

      isRunning = true;
      await startBackgroundMusic();

      const { min, max, count } = settings;

      initBoxes(count);
      setControlsDisabled(true);
      startBtn.textContent = 'ĐANG QUAY...';

      const boxes = [...document.querySelectorAll('.ball')];
      const finalNumbers = uniqueRandomNumbers(count, min, max);
      const totalBatches = Math.ceil(count / BATCH_SIZE);

      for (let start = 0; start < count; start += BATCH_SIZE) {
        const batchIndex = Math.floor(start / BATCH_SIZE) + 1;
        const end = Math.min(start + BATCH_SIZE, count);
        const batchNumbers = finalNumbers.slice(start, end);
        const batchBoxes = boxes.slice(start, end);

        subtitleEl.textContent = `🎡 Đang quay đợt ${batchIndex}/${totalBatches}`;
        statusPill.textContent = `Chuẩn bị mở ${batchNumbers.length} số sau ${SPIN_DURATION / 1000} giây...`;
        noteEl.textContent = `Hồi hộp nào! Đợt này sẽ hiện ${batchNumbers.length} số.`;

        batchBoxes.forEach((box, index) => {
          startHorizontalReel(box, batchNumbers[index], min, max, SPIN_DURATION, index);
        });

        await wait(SPIN_DURATION);

        batchBoxes.forEach((box, index) => {
          finalizeBox(box, batchNumbers[index]);
        });

        progressBar.style.width = `${Math.round((end / count) * 100)}%`;
        noteEl.textContent = `Đã mở ${end}/${count} số.`;
        groupRevealSound();
        fireConfetti(26);
      }

      subtitleEl.textContent = '🎉 Hoàn thành!';
      statusPill.textContent = `Đã quay đủ ${count} số không trùng`;
      noteEl.textContent = 'Chúc mừng các số may mắn!';
      victorySound();
      fireConfetti(90);

      setControlsDisabled(false);
      startBtn.textContent = '🎡 QUAY LẠI';
      isRunning = false;
    }

    function resetNumbers() {
      if (isRunning) return;

      const settings = getSettings(true);
      if (!settings) return;

      initBoxes(settings.count);
      startBtn.textContent = '🎡 QUAY SỐ';
      startBtn.disabled = false;
      subtitleEl.textContent = '🎲 Xổ Số Vui Nhộn';
      statusPill.textContent = `Mỗi ${SPIN_DURATION / 1000} giây mở ${BATCH_SIZE} số 🎉`;
    }

    allInputs.forEach(input => {
      input.addEventListener('input', updateText);

      input.addEventListener('change', () => {
        const settings = getSettings(false);
        if (settings && !isRunning) initBoxes(settings.count);
      });
    });

    initBoxes();
  </script>
</body>
</html>
